<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Рейтинг машин</title>
  <style>
    body {
      margin: 0;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      height: 100vh;
      font-family: sans-serif;
      color: white;
      font-size: 50px;
      text-shadow: 2px 2px 10px black;
    }
    .car {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    .score {
      font-size: 70px;
      color: #ffd700;
    }
    .car img {
      width: 120px; /* можешь поменять размер */
      height: auto;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="counrty"><img src="Country1.png" alt="country1"><div class="score" id="сar1">0</div></div>
  <div class="counrty"><img src="Country2.png" alt="country2"><div class="score" id="car2">0</div></div>
  <div class="counrty"><img src="Country3.png" alt="country3"><div class="score" id="car3">0</div></div>
  <div class="counrty"><img src="Country4.png" alt="country4"><div class="score" id="car4">0</div></div>
  <div class="counrty"><img src="Country5.png" alt="country5"><div class="score" id="car5">0</div></div>

  <script>
    function updateScores() {
      for (let i = 1; i <= 5; i++) {
        const score = localStorage.getItem("car" + i + "_score") || 0;
        document.getElementById("car" + i).textContent = score;
      }
    }

    setInterval(updateScores, 500);
    updateScores();
  </script>
</body>
</html>
